name: Apply event form upgrade
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-event-form-upgrade.py'
      - '.github/workflows/apply-event-form-upgrade.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply-event-form-upgrade.py
      - name: Commit event form changes
        run: |
          git config user.name "orders-ng-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/page.tsx app/layout.tsx app/event-form.css
          git diff --cached --quiet && exit 0
          git commit -m "Ridisegna scheda evento e aggiunge prezzo menu baby"
          git push
