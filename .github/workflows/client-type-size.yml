name: Aggiorna dimensione selettore cliente
on:
  push:
    paths:
      - '.github/workflows/client-type-size.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/globals.css')
          s=p.read_text()
          old='.clientTypeField{grid-column:1/-1;width:100%;max-width:320px}.clientTypeField select{min-height:52px}'
          new='.clientTypeField{grid-column:1/-1;width:100%;max-width:230px}.clientTypeField select{height:44px;min-height:44px;font-size:16px;font-weight:700;padding:0 14px}'
          if old not in s:
              raise SystemExit('CSS atteso non trovato')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/client-type-size.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/globals.css .github/workflows/client-type-size.yml
          git commit -m 'Ridimensiona selettore tipo cliente'
          git push